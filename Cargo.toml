[package]
name = "rivet-av1"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-av1"
homepage = "https://github.com/safewords/rivet-av1"
documentation = "https://docs.rs/rivet-av1"
authors = ["Ely Erin Fox"]
description = "An AV1 decoder and encoder in Rust, written from the AV1 Bitstream & Decoding Process Specification: no C, no system libraries, no build script. Decodes OBU streams (IVF, Annex B-free low-overhead format) bit-exactly against the AOM test vectors; a key-frame and inter-frame encoder. rivet's AV1 codec. Imported as `av1`."
keywords = ["av1", "video", "decoder", "encoder", "codec"]
categories = ["multimedia::video", "multimedia::encoding"]
exclude = [".github/", "tools/", "tests/vectors/"]

[lib]
name = "av1"

[dependencies]
thiserror = "2"

[dev-dependencies]
md5 = "0.7"
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = ["encoder"]
# The encoder: `Encoder`, `Config`, `Tools` and everything behind them. Off,
# the crate is a decoder alone, and none of the encoder is compiled or linked
# (for a smaller WebAssembly build: `default-features = false`).
encoder = []

# The encoder's examples and the tests that encode their streams.
[[example]]
name = "av1_ivfenc"
required-features = ["encoder"]

[[example]]
name = "av1_rdcurve"
required-features = ["encoder"]

[[example]]
name = "av1_ratetest"
required-features = ["encoder"]

[[test]]
name = "encode"
required-features = ["encoder"]

[[test]]
name = "conformance"
required-features = ["encoder"]

[[test]]
name = "recovery"
required-features = ["encoder"]

[profile.test]
opt-level = 2
